<!doctype html>
<html lang="en">
  <head>
    <!-- =========================================
         BASIC DOCUMENT METADATA
    ========================================== -->

    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="theme-color"
      content="#050505"
    />


    <!-- =========================================
         FAVICON
         Browser Tab / Search Results
    ========================================== -->

    <link
      rel="icon"
      type="image/png"
      sizes="48x48"
      href="/favicon-48x48.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/favicon-192x192.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/favicon-512x512.png"
    />

    <link
      rel="shortcut icon"
      href="/favicon.ico"
    />

    <link
  rel="apple-touch-icon"
  sizes="180x180"
  href="/apple-touch-icon.png"
/>

    <!-- =========================================
         FALLBACK SEO
         Dynamic page SEO is handled by React Helmet
    ========================================== -->

    <title>Centa Limited</title>

    <meta
      name="description"
      content="Centa Limited provides software development, cybersecurity, and secure digital infrastructure solutions."
    />

    <meta
      name="robots"
      content="index, follow, max-image-preview:large"
    />


    <!-- =========================================
         FALLBACK OPEN GRAPH
         Dynamic route metadata is handled by React Helmet
    ========================================== -->

    <meta
      property="og:site_name"
      content="Centa Limited"
    />

    <meta
      property="og:locale"
      content="en_US"
    />

    <meta
      property="og:image"
      content="https://centa.ltd/og-image.png"
    />

    <meta
      property="og:image:secure_url"
      content="https://centa.ltd/og-image.png"
    />

    <meta
      property="og:image:type"
      content="image/png"
    />

    <meta
      property="og:image:alt"
      content="Centa Limited"
    />


    <!-- =========================================
         FALLBACK X / TWITTER
    ========================================== -->

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:image"
      content="https://centa.ltd/og-image.png"
    />

    <meta
      name="twitter:image:alt"
      content="Centa Limited"
    />


    <!-- =========================================
         STRUCTURED DATA
         ORGANIZATION
    ========================================== -->

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Centa Limited",
        "url": "https://centa.ltd/",
        "logo": "https://centa.ltd/logo.png",
        "image": "https://centa.ltd/og-image.png",
        "description": "Centa Limited provides software development, web development, application development, cybersecurity, and secure digital infrastructure solutions."
      }
    </script>

  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
